<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>희넝이네 4컷 웹툰</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Gowun+Dodum&display=swap">
<style>
/* Layout: comic strip preview on top (tap a panel to edit it), panel editor below, sticky save bar at the bottom */
:root {
  --bg: #f3f5ec; --card: #ffffff; --fg: #2a2b26; --muted: #6c6f63; --accent: #d9534f; --ok: #4f9a63; --line: #dfe2d4;
  --f-pixel: "DotGothic16", "Gowun Dodum", system-ui, sans-serif; --f-body: "Gowun Dodum", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root { --bg: #1d1f1b; --card: #2a2d27; --fg: #eef0e8; --muted: #a8ac9e; --accent: #f07a72; --ok: #7cc48f; --line: #3a3e35; color-scheme: dark } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.app { max-width: 520px; margin: 0 auto; padding-block: calc(16px + env(safe-area-inset-top, 0px)) 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
h1 { font-family: var(--f-pixel); font-weight: 400; font-size: 22px; margin: 0; }
a.back { color: var(--muted); font-size: 14px; text-decoration: none; }
.muted { color: var(--muted); font-size: 13px; margin: 0; }
canvas { display: block; width: 100%; height: auto; border: 3px solid var(--fg); border-radius: 6px; background: #fff; touch-action: none; }
.panel-tabs { display: flex; gap: 6px; }
.panel-tabs button { flex: 1; font-family: var(--f-pixel); font-size: 15px; padding: 6px 0; border: 2px solid var(--line); background: var(--card); color: var(--fg); border-radius: 6px; cursor: pointer; }
.panel-tabs button.on { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.box { background: var(--card); border: 2px solid var(--fg); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.box h2 { font-family: var(--f-pixel); font-weight: 400; font-size: 16px; margin: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.sw.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }
.chip { font: inherit; font-size: 14px; border: 2px solid var(--fg); background: var(--card); color: var(--fg); border-radius: 999px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip img { height: 26px; width: auto; }
.chip.ghost { border-color: var(--line); }
input[type=text], textarea { font: inherit; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { min-height: 56px; resize: vertical; }
.sel { border-top: 2px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.btn { font-family: var(--f-pixel); font-size: 15px; background: var(--accent); color: #fff; border: 2px solid var(--fg); border-radius: 6px; padding: 7px 14px; cursor: pointer; box-shadow: 2px 2px 0 var(--fg); }
.btn:active { transform: translate(2px, 2px); box-shadow: none; }
.btn.ghost { background: var(--card); color: var(--fg); }
.save { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 2px solid var(--line); z-index: 5;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.save div { max-width: 520px; margin: 0 auto; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; }
.sheet img { max-width: 100%; max-height: 72vh; border-radius: 6px; background: #fff; }
.sheet p { color: #fff; margin: 0; text-align: center; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header><h1>희넝이네 4컷 웹툰</h1><a class="back" id="back" href="./">← 완주 지도</a></header>
  <p class="muted">칸을 고르고 캐릭터를 올린 다음, 그림 위에서 손가락으로 끌어 옮겨요.</p>

  <canvas id="cv" width="900" height="2710" aria-label="웹툰 미리보기"></canvas>

  <div class="panel-tabs" id="tabs"></div>

  <section class="box">
    <h2 id="ed-title">1컷 꾸미기</h2>
    <div class="row" id="bgs" aria-label="배경 색"></div>
    <label class="muted" for="narr">장면 설명 (칸 위쪽 글씨, 선택)</label>
    <input type="text" id="narr" maxlength="30" placeholder="예: 월급날 저녁">
    <div class="muted">캐릭터 올리기</div>
    <div class="row" id="adds"></div>
    <div class="row">
      <button class="chip ghost" type="button" id="add-bub">＋ 말풍선</button>
      <label class="chip ghost" for="up">＋ 내 그림 올리기</label>
      <input type="file" id="up" accept="image/*" hidden>
    </div>
    <div class="sel" id="sel" hidden>
      <div class="muted" id="sel-name"></div>
      <textarea id="bub-text" maxlength="60" placeholder="대사를 입력하세요" hidden></textarea>
      <div class="row">
        <button class="chip" type="button" data-act="smaller">작게</button>
        <button class="chip" type="button" data-act="bigger">크게</button>
        <button class="chip" type="button" data-act="flip" id="flip">좌우 뒤집기</button>
        <button class="chip" type="button" data-act="del">삭제</button>
      </div>
    </div>
  </section>

  <section class="box">
    <h2>처음부터 다시</h2>
    <p class="muted">지금 만든 4컷을 전부 지워요.</p>
    <button class="btn ghost" type="button" id="reset" style="align-self:flex-start">전부 지우기</button>
  </section>
</div>

<div class="save"><div><span class="muted">그린 건 이 폰에 자동 저장돼요</span><button class="btn" type="button" id="save">그림으로 저장</button></div></div>
<div class="sheet" id="sheet" hidden><img id="out" alt="완성된 4컷 웹툰"><p id="sheet-tip">이미지를 길게 눌러 사진에 저장하세요.</p><div class="row"><button class="btn" type="button" id="share">공유하기</button><button class="btn ghost" type="button" id="close">닫기</button></div></div>

<script>
const W = 900, PH = 640, M = 30, G = 30;
const BGS = ['#cfe6ff', '#cfe0b4', '#f9dff0', '#fdf3cf', '#ffffff', '#2d3a5c'];
const BUILTIN = { gwan: { name: '관이', src: 'img/gwan.png', h: 330 }, neong: { name: '넝이', src: 'img/neong.png', h: 225 }, baby: { name: '선물이', src: 'img/baby.png', h: 150 } };
const $ = id => document.getElementById(id);
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } } };
const back = new URL(location.href).searchParams.get('k'); if (back) $('back').href = './?k=' + encodeURIComponent(back);

let state = blank(), cur = 0, sel = null;
let customs = {};
try { state = JSON.parse(store.get('toon-state')) || state; } catch (e) {}
try { customs = JSON.parse(store.get('toon-customs')) || {}; } catch (e) {}
function blank() { return { panels: [0, 1, 2, 3].map(i => ({ bg: i % 4, narr: '', items: [] })) }; }
const images = {};
function img(id) {
  if (images[id]) return images[id];
  const src = BUILTIN[id] ? BUILTIN[id].src : customs[id]?.data;
  if (!src) return null;
  const im = new Image(); im.onload = () => draw(); im.src = src; images[id] = im; return im;
}
const save = () => store.set('toon-state', JSON.stringify(state));
const panelTop = i => M + i * (PH + G);

/* ---------- drawing ---------- */
const cv = $('cv'), ctx = cv.getContext('2d');
function wrap(text, maxW) {
  const out = []; let line = '';
  for (const ch of text) { if (ch === '\n') { out.push(line); line = ''; continue; } const t = line + ch; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = ch; } else line = t; }
  if (line) out.push(line); return out.length ? out : [''];
}
function drawBubble(b, top, selected) {
  ctx.font = '30px "Gowun Dodum", sans-serif';
  const lines = wrap(b.text || '…', 320); const lw = Math.max(...lines.map(l => ctx.measureText(l).width));
  const w = lw + 44, h = lines.length * 40 + 28, x = b.x - w / 2, y = top + b.y - h;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#2a2b26'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 22); ctx.fill(); ctx.stroke();
  const tx = b.x + (b.tail || 0) * 30;
  ctx.beginPath(); ctx.moveTo(tx - 14, y + h - 2); ctx.lineTo(tx + 4, y + h + 26); ctx.lineTo(tx + 14, y + h - 2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(tx - 14, y + h); ctx.lineTo(tx + 4, y + h + 26); ctx.lineTo(tx + 14, y + h); ctx.stroke();
  ctx.fillStyle = '#2a2b26'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  lines.forEach((l, i) => ctx.fillText(l, b.x, y + 16 + i * 40));
  b._box = [x, y - top, w, h + 26];
  if (selected) { ctx.setLineDash([10, 8]); ctx.strokeStyle = '#d9534f'; ctx.strokeRect(x - 8, y - 8, w + 16, h + 40); ctx.setLineDash([]); }
}
function draw(forExport) {
  ctx.fillStyle = '#fffdf8'; ctx.fillRect(0, 0, W, cv.height);
  state.panels.forEach((p, i) => {
    const top = panelTop(i);
    ctx.save(); ctx.beginPath(); ctx.rect(M, top, W - 2 * M, PH); ctx.clip();
    ctx.fillStyle = BGS[p.bg]; ctx.fillRect(M, top, W - 2 * M, PH);
    ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(M, top + PH * 0.78, W - 2 * M, PH * 0.22);
    for (const it of p.items) {
      if (it.kind !== 'char') continue;
      const im = img(it.id); if (!im || !im.complete || !im.naturalWidth) continue;
      const h = it.h * it.s, w = im.naturalWidth * h / im.naturalHeight;
      ctx.save(); ctx.translate(it.x, top + it.y); if (it.flip) ctx.scale(-1, 1);
      ctx.drawImage(im, -w / 2, -h, w, h); ctx.restore();
      it._box = [it.x - w / 2, it.y - h, w, h];
      if (!forExport && i === cur && sel === it) { ctx.setLineDash([10, 8]); ctx.strokeStyle = '#d9534f'; ctx.lineWidth = 4; ctx.strokeRect(it.x - w / 2 - 6, top + it.y - h - 6, w + 12, h + 12); ctx.setLineDash([]); }
    }
    for (const it of p.items) if (it.kind === 'bub') drawBubble(it, top, !forExport && i === cur && sel === it);
    if (p.narr) {
      ctx.font = '28px "Gowun Dodum", sans-serif'; const tw = ctx.measureText(p.narr).width;
      ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#2a2b26'; ctx.lineWidth = 3;
      ctx.fillRect(M + 16, top + 16, tw + 28, 46); ctx.strokeRect(M + 16, top + 16, tw + 28, 46);
      ctx.fillStyle = '#2a2b26'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(p.narr, M + 30, top + 40);
    }
    ctx.restore();
    ctx.strokeStyle = '#2a2b26'; ctx.lineWidth = 6; ctx.strokeRect(M, top, W - 2 * M, PH);
    if (!forExport && i === cur) { ctx.strokeStyle = '#d9534f'; ctx.lineWidth = 8; ctx.strokeRect(M - 8, top - 8, W - 2 * M + 16, PH + 16); }
  });
}

/* ---------- editor ---------- */
function renderEditor() {
  $('tabs').innerHTML = [0, 1, 2, 3].map(i => `<button type="button" class="${i === cur ? 'on' : ''}" data-p="${i}">${i + 1}컷</button>`).join('');
  $('ed-title').textContent = (cur + 1) + '컷 꾸미기';
  const p = state.panels[cur];
  $('bgs').innerHTML = BGS.map((c, i) => `<button type="button" class="sw ${p.bg === i ? 'on' : ''}" data-bg="${i}" style="background:${c}" aria-label="배경 ${i + 1}"></button>`).join('');
  $('narr').value = p.narr;
  const all = { ...Object.fromEntries(Object.entries(BUILTIN).map(([k, v]) => [k, { name: v.name, src: v.src }])), ...Object.fromEntries(Object.entries(customs).map(([k, v]) => [k, { name: v.name, src: v.data }])) };
  $('adds').innerHTML = Object.entries(all).map(([k, v]) => `<button type="button" class="chip" data-add="${k}"><img src="${v.src}" alt="">${v.name}</button>`).join('');
  $('sel').hidden = !sel;
  if (sel) {
    const isB = sel.kind === 'bub';
    $('sel-name').textContent = isB ? '고른 말풍선' : '고른 캐릭터: ' + (BUILTIN[sel.id]?.name || customs[sel.id]?.name || '');
    $('bub-text').hidden = !isB; if (isB) $('bub-text').value = sel.text;
    $('flip').textContent = isB ? '꼬리 방향' : '좌우 뒤집기';
  }
}
function update() { save(); draw(); renderEditor(); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const p = state.panels[cur];
  if (t.dataset.p) { cur = +t.dataset.p; sel = null; update(); }
  else if (t.dataset.bg) { p.bg = +t.dataset.bg; update(); }
  else if (t.dataset.add) {
    const id = t.dataset.add, n = p.items.filter(x => x.kind === 'char').length;
    const it = { kind: 'char', id, h: BUILTIN[id]?.h || 260, s: 1, x: 200 + (n % 3) * 250, y: PH * 0.92, flip: false };
    p.items.push(it); sel = it; update();
  }
  else if (t.id === 'add-bub') { const it = { kind: 'bub', text: '', x: W / 2, y: 200, tail: 0 }; p.items.push(it); sel = it; update(); $('bub-text').focus(); }
  else if (t.dataset.act && sel) {
    const a = t.dataset.act;
    if (a === 'smaller' || a === 'bigger') { if (sel.kind === 'char') sel.s = Math.min(2.2, Math.max(0.4, sel.s * (a === 'bigger' ? 1.15 : 0.87))); }
    if (a === 'flip') { if (sel.kind === 'char') sel.flip = !sel.flip; else sel.tail = sel.tail === -3 ? 3 : sel.tail === 3 ? 0 : -3; }
    if (a === 'del') { p.items = p.items.filter(x => x !== sel); sel = null; }
    update();
  }
  else if (t.id === 'reset') {
    if (!t.dataset.armed) { t.dataset.armed = '1'; t.textContent = '한 번 더 누르면 지워져요'; setTimeout(() => { delete t.dataset.armed; t.textContent = '전부 지우기'; }, 3000); return; }
    state = blank(); cur = 0; sel = null; delete t.dataset.armed; t.textContent = '전부 지우기'; update();
  }
});
$('narr').addEventListener('input', e => { state.panels[cur].narr = e.target.value; save(); draw(); });
$('bub-text').addEventListener('input', e => { if (sel && sel.kind === 'bub') { sel.text = e.target.value; save(); draw(); } });

/* ---------- dragging on the canvas ---------- */
let drag = null;
function pt(e) { const r = cv.getBoundingClientRect(); const k = W / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; }
cv.addEventListener('pointerdown', e => {
  const q = pt(e);
  const pi = state.panels.findIndex((_, i) => q.y >= panelTop(i) && q.y <= panelTop(i) + PH);
  if (pi < 0) return;
  if (pi !== cur) { cur = pi; sel = null; }
  const ly = q.y - panelTop(pi), items = state.panels[pi].items;
  const hit = [...items].reverse().find(it => it._box && q.x >= it._box[0] && q.x <= it._box[0] + it._box[2] && ly >= it._box[1] && ly <= it._box[1] + it._box[3]);
  sel = hit || null;
  if (hit) { drag = { it: hit, dx: hit.x - q.x, dy: hit.y - ly, pi }; cv.setPointerCapture(e.pointerId); }
  draw(); renderEditor();
});
cv.addEventListener('pointermove', e => {
  if (!drag) return; const q = pt(e);
  drag.it.x = Math.min(W - M, Math.max(M, q.x + drag.dx));
  drag.it.y = Math.min(PH + 40, Math.max(40, q.y - panelTop(drag.pi) + drag.dy));
  draw();
});
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { if (drag) { drag = null; save(); } }));

/* ---------- upload own picture, remove its plain background ---------- */
$('up').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    const im = new Image();
    im.onload = () => {
      const H = 420, w0 = Math.round(im.naturalWidth * H / im.naturalHeight);
      const c = document.createElement('canvas'); c.width = w0; c.height = H; const x = c.getContext('2d'); x.drawImage(im, 0, 0, w0, H);
      const d = x.getImageData(0, 0, w0, H), a = d.data, bg = [a[0], a[1], a[2]];
      const near = i => Math.abs(a[i] - bg[0]) + Math.abs(a[i + 1] - bg[1]) + Math.abs(a[i + 2] - bg[2]) < 40;
      const seen = new Uint8Array(w0 * H), st = [];
      for (let i = 0; i < w0; i++) st.push(i, (H - 1) * w0 + i);
      for (let j = 0; j < H; j++) st.push(j * w0, j * w0 + w0 - 1);
      while (st.length) { const p = st.pop(); if (seen[p]) continue; seen[p] = 1; if (!near(p * 4)) continue; a[p * 4 + 3] = 0; const px = p % w0, py = (p / w0) | 0;
        if (px > 0) st.push(p - 1); if (px < w0 - 1) st.push(p + 1); if (py > 0) st.push(p - w0); if (py < H - 1) st.push(p + w0); }
      x.putImageData(d, 0, 0);
      let minX = w0, minY = H, maxX = 0, maxY = 0;
      for (let p = 0; p < w0 * H; p++) if (a[p * 4 + 3]) { const px = p % w0, py = (p / w0) | 0; if (px < minX) minX = px; if (px > maxX) maxX = px; if (py < minY) minY = py; if (py > maxY) maxY = py; }
      const t = document.createElement('canvas'); t.width = Math.max(1, maxX - minX + 1); t.height = Math.max(1, maxY - minY + 1);
      t.getContext('2d').drawImage(c, minX, minY, t.width, t.height, 0, 0, t.width, t.height);
      const id = 'c' + Date.now(), n = Object.keys(customs).length + 1;
      customs[id] = { name: '내 그림 ' + n, data: t.toDataURL('image/png') };
      if (!store.set('toon-customs', JSON.stringify(customs))) { delete customs[id]; alertBox('폰 저장 공간이 꽉 찼어요. 올린 그림을 몇 개 지워 주세요.'); return; }
      const p = state.panels[cur]; const it = { kind: 'char', id, h: 260, s: 1, x: W / 2, y: PH * 0.92, flip: false };
      p.items.push(it); sel = it; update();
    };
    im.src = r.result;
  };
  r.readAsDataURL(f); e.target.value = '';
});
function alertBox(msg) { $('sheet-tip').textContent = msg; $('out').hidden = true; $('share').hidden = true; $('sheet').hidden = false; }

/* ---------- export ---------- */
let blob = null;
$('save').addEventListener('click', () => {
  const keep = sel; sel = null; draw(true);
  cv.toBlob(b => {
    blob = b; $('out').src = URL.createObjectURL(b); $('out').hidden = false;
    $('sheet-tip').textContent = '이미지를 길게 눌러 사진에 저장하세요.';
    $('share').hidden = !(navigator.canShare && navigator.canShare({ files: [new File([b], 'toon.png', { type: 'image/png' })] }));
    $('sheet').hidden = false; sel = keep; draw();
  }, 'image/png');
});
$('share').addEventListener('click', async () => { try { await navigator.share({ files: [new File([blob], '희넝이네-웹툰.png', { type: 'image/png' })], title: '희넝이네 4컷 웹툰' }); } catch (e) {} });
$('close').addEventListener('click', () => { $('sheet').hidden = true; });

Object.keys(BUILTIN).forEach(img); Object.keys(customs).forEach(img);
document.fonts.load('30px "Gowun Dodum"').finally(() => draw());
update();
</script>
</body>
</html>
